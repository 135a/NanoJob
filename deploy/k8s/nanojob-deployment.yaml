apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanojob-engine
  namespace: default
  labels:
    app: nanojob
spec:
  # 霸气声明：部署 3 个引擎实例，配合分布式抢锁选主机制实现极高可用 (HA)
  replicas: 3
  selector:
    matchLabels:
      app: nanojob
  template:
    metadata:
      labels:
        app: nanojob
    spec:
      containers:
      - name: engine
        image: nanojob/engine:v1.5
        imagePullPolicy: IfNotPresent
        # 【架构精髓】：通过命令行参数传入 K8s 内部域名，而非硬编码 IP。
        # K8s 的 CoreDNS 会自动将 etcd-service 解析到真实的 etcd Pod，并在宕机时毫秒级更新路由。
        args: 
          - "-etcd=etcd-service.default.svc.cluster.local:2379"
          - "-port=8080"
        ports:
        - containerPort: 8080
        # 极低的资源占用声明：启动仅需 64MB 内存
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

---
# 暴露 NanoJob 引擎的统一内部入口，供前端 UI 或其他微服务调用
apiVersion: v1
kind: Service
metadata:
  name: nanojob-service
  namespace: default
spec:
  selector:
    app: nanojob
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
