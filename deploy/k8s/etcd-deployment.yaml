apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: default
  labels:
    app: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.9
        command:
          - /usr/local/bin/etcd
          - --listen-client-urls=http://0.0.0.0:2379
          - --advertise-client-urls=http://0.0.0.0:2379
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 2379
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-service # 【核心枢纽】Go引擎通过这个名字找到它
  namespace: default
spec:
  selector:
    app: etcd
  ports:
    - protocol: TCP
      port: 2379
      targetPort: 2379
