# 1. 客户端访问服务 (Client Service)
# 保留你原来的 etcd-service，方便某些旧服务直接通过这个名字进行负载均衡访问
apiVersion: v1
kind: Service
metadata:
  name: etcd-service # 【核心枢纽】Go引擎通过这个名字找到它
  namespace: default
spec:
  selector:
    app: etcd
  ports:
    - name: client
      protocol: TCP
      port: 2379
      targetPort: 2379

---
# 2. 无头服务 (Headless Service)
# 专供 etcd 集群内部节点互相发现和通信使用 (不分配统一 IP)
apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: default
spec:
  clusterIP: None  # 核心：设置为 None 即为无头服务
  selector:
    app: etcd
  ports:
    - name: peer
      protocol: TCP
      port: 2380
      targetPort: 2380
    - name: client
      protocol: TCP
      port: 2379
      targetPort: 2379

---
# 3. 有状态副本集 (StatefulSet)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: default
  labels:
    app: etcd
spec:
  serviceName: etcd-headless  # 绑定上面的无头服务
  replicas: 3                 # 修改点 1：将 1 改为 3 节点
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.9
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 2379
        - name: peer
          containerPort: 2380
        env:
        # 将 Pod 的名字 (如 etcd-0) 注入为环境变量
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # 修改点 2：改写启动命令，加入完整的集群参数
        command:
          - /usr/local/bin/etcd
          - --name=$(POD_NAME)
          - --listen-client-urls=http://0.0.0.0:2379
          - --listen-peer-urls=http://0.0.0.0:2380
          - --advertise-client-urls=http://$(POD_NAME).etcd-headless.default.svc.cluster.local:2379
          - --initial-advertise-peer-urls=http://$(POD_NAME).etcd-headless.default.svc.cluster.local:2380
          - --initial-cluster=etcd-0=http://etcd-0.etcd-headless.default.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.default.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.default.svc.cluster.local:2380
          - --initial-cluster-token=etcd-cluster-token
          - --initial-cluster-state=new
          - --data-dir=/var/run/etcd/data
        volumeMounts:
        - name: etcd-data
          mountPath: /var/run/etcd/data
  # 修改点 3：增加持久化存储，防止节点重启丢失数据
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi # 为每个 etcd 节点申请 2GB 云盘（根据你们的情况可以调大）
