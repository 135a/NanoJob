apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: default
  labels:
    app: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: bitnami/etcd:3.5.9
        imagePullPolicy: IfNotPresent
        env:
        - name: ALLOW_NONE_AUTHENTICATION
          value: "yes" # 演示环境关闭鉴权，方便极速启动
        ports:
        - containerPort: 2379
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-service # 【核心枢纽】Go引擎通过这个名字找到它
  namespace: default
spec:
  selector:
    app: etcd
  ports:
    - protocol: TCP
      port: 2379
      targetPort: 2379
