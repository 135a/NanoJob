version: '3.8'

services:
  # 1. MySQL: 任务配置 + 触发时间 + 执行日志 (暂单实例)
  mysql:
    image: mysql:8.0
    container_name: nanojob-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=nanojob
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    # 关键: 引擎必须在 MySQL 真正就绪 (能接受连接) 后才启动,
    # 否则首次启动初始化 20-60s 期间 dial tcp ... connection refused 直接 panic。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # 2. Redis: 选主锁 + 执行器注册表 (TTL 过期自动摘除)
  redis:
    image: redis:7-alpine
    container_name: nanojob-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. NanoJob Go 调度引擎 × 3: 演示选举 / 时间轮 / 故障转移
  #    每台引擎 advertise_addr 不同 (锁持有值 = Leader 地址), 数据都指向共享 MySQL/Redis
  nanojob1:
    build: .
    container_name: nanojob-engine-1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NANOJOB_DSN=root:123456@tcp(mysql:3306)/nanojob?charset=utf8mb4&parseTime=true
      - NANOJOB_REDIS_ADDR=redis:6379
      - NANOJOB_ADVERTISE_ADDR=http://nanojob1:8080
    ports:
      - "8401:8080"

  nanojob2:
    build: .
    container_name: nanojob-engine-2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NANOJOB_DSN=root:123456@tcp(mysql:3306)/nanojob?charset=utf8mb4&parseTime=true
      - NANOJOB_REDIS_ADDR=redis:6379
      - NANOJOB_ADVERTISE_ADDR=http://nanojob2:8080
    ports:
      - "8402:8080"

  nanojob3:
    build: .
    container_name: nanojob-engine-3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NANOJOB_DSN=root:123456@tcp(mysql:3306)/nanojob?charset=utf8mb4&parseTime=true
      - NANOJOB_REDIS_ADDR=redis:6379
      - NANOJOB_ADVERTISE_ADDR=http://nanojob3:8080
    ports:
      # 宿主侧映射避开 Windows 排除端口段: 8081/8082/8083 会被 Hyper-V/winnat 预留 (7991-8090) 导致绑定失败
      - "8403:8080"

volumes:
  mysql-data:
